name: Nextcloud app setup

on:
  push:
    paths:
      - '**setup-nextcloud-app**'
      - 'package.json'
      - 'package-lock.json'
      - 'node_modules/**'
  pull_request:
      paths:
      - '**setup-nextcloud-app**'
      - 'package.json'
      - 'package-lock.json'
      - 'node_modules/**'

permissions: {}

jobs:
  setup-nextcloud-app:
    runs-on: ubuntu-latest
    env:
      FILENAME: ".revision"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'

      - name: Server setup
        uses: $/setup-nextcloud/
        with:
          version: 'stable31'
          database-type: 'sqlite'

      - name: Test setup
        run: |
          mkdir appinfo && 
          curl https://raw.githubusercontent.com/nextcloud/app-tutorial/HEAD/appinfo/info.xml -o appinfo/info.xml

      - name: Script test
        uses: $/setup-nextcloud-app/
        with:
          app: 'notestutorial'
          check-code: false
          force: true

      - name: Test setup
        run: cd ../server && ./occ app:list | grep notestutorial
